<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#2E7FA0"/>
  
  <!-- Diagonal stripe accent -->
  <rect x="0" y="0" width="200" height="200" fill="url(#diagonalGradient)" opacity="0.3"/>
  <defs>
    <linearGradient id="diagonalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Vertical divider -->
  <line x1="100" y1="20" x2="100" y2="180" stroke="white" stroke-width="3"/>
  
  <!-- Horizontal divider -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="white" stroke-width="3"/>
  
  <!-- H R N K letters -->
  <text x="35" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white">H</text>
  <text x="125" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white">R</text>
  <text x="35" y="155" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white">N</text>
  <text x="125" y="155" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white">K</text>
</svg>
