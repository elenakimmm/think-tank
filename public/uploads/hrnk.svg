<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="220" height="220" fill="#2E7FA0" rx="0"/>
  
  <!-- Vertical divider line -->
  <line x1="110" y1="10" x2="110" y2="210" stroke="white" stroke-width="4"/>
  
  <!-- Horizontal divider line -->
  <line x1="10" y1="110" x2="210" y2="110" stroke="white" stroke-width="4"/>
  
  <!-- H - top left -->
  <text x="20" y="85" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white">H</text>
  
  <!-- R - top right -->
  <text x="125" y="85" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white">R</text>
  
  <!-- N - bottom left -->
  <text x="20" y="175" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white">N</text>
  
  <!-- K - bottom right -->
  <text x="125" y="175" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white">K</text>
</svg>
